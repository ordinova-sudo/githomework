<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile</title>

    <!-- Fichier CSS externe -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="badge-card">

        <img
            src="https://ui-avatars.com/api/?name=Your+Name&size=150&background=1b365d&color=fff"
            alt="Your Name"
        >

        <h1>Student Profile</h1>

        <h2>Mohamed Amine Houidi</h2>

        <div class="badge-meta">
            <span class="year">Class of 2026</span>
        </div>

        <p class="description">
            fullstack dev
        </p>

        <button class="profile-btn" onclick="showProfile()">
            View Profile
        </button>

    </div>

    <script>
        function showProfile() {
            alert("Welcome to Your Name's profile!");
        }
    </script>

</body>
</html>
